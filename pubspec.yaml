name: MartIt
description: "MartIt - A TikTok-style shopping app combining short-form content
  with e-commerce."
publish_to: 'none'
version: 1.2.8+35
environment:
  sdk: ^3.9.2
dependencies:
  awesome_dialog: ^3.2.0
  awesome_snackbar_content: ^0.1.1
  cached_network_image: ^3.3.0
  crypto: ^3.0.3
  camerawesome: ^2.0.2
  chewie: ^1.7.5
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_secure_storage: ^9.0.0
  flutter_spinkit: ^5.2.2
  flutter_staggered_grid_view: ^0.7.0
  geocoding: ^4.0.0
  geolocator: ^10.1.0
  get: ^4.6.6
  google_fonts: ^6.1.0
  google_sign_in: ^7.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  iconsax: ^0.0.8
  image: ^4.9.1
  image_picker: ^1.0.4
  intl: ^0.20.2
  lottie: ^3.3.3
  mobile_scanner: ^7.2.0
  onesignal_flutter: ^5.0.4
  package_info_plus: ^9.0.0
  path_provider: ^2.1.1
  permission_handler: ^11.1.0
  pinput: ^5.0.1
  provider: ^6.1.1
  restart_app: ^1.3.2
  share_plus: ^7.2.2
  shared_preferences: ^2.2.2
  sign_in_with_apple: ^6.1.4
  shimmer: ^3.0.0
  shorebird_code_push: ^2.0.5
  terminate_restart: ^1.0.11
  url_launcher: ^6.2.2
  uuid: ^4.2.1
  video_player: ^2.8.1
  video_thumbnail: ^0.5.6
  webview_flutter: ^4.13.1

  path: any
  http: any
dev_dependencies:
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#EAE5FC"
  adaptive_icon_foreground: "assets/images/app_icon.jpg"
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/images/social/
    - lib/l10n/ar.json
    - lib/l10n/en.json
    - shorebird.yaml
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito/Nunito-ExtraBold.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal/Tajawal-ExtraBold.ttf
